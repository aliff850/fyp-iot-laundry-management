name: Build Customer Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "FastAPI backend base URL (defaults to Render production URL)"
        required: false
        default: "https://esp32-gas-api.onrender.com"
  push:
    branches: [master, main]
    paths:
      - "mobile-app/mobile-app/**"
      - ".github/workflows/build-customer-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & run tests
        run: |
          flutter analyze
          flutter test

      - name: Build release APK
        env:
          API_URL: ${{ inputs.api_url || 'https://esp32-gas-api.onrender.com' }}
        run: |
          flutter build apk --release --dart-define=SPINSENSE_API_URL="${API_URL}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spinsense-customer-apk
          path: mobile-app/mobile-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
