<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Local staff sign in — SpinSense Gateway</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/Manrope-variable.ttf') }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="flex min-h-screen items-center justify-center bg-canvas px-4 font-sans text-sm text-ink">
  <main class="w-full max-w-md rounded-md border border-line bg-surface px-5 py-6 md:p-7">
    <div class="mb-6 flex items-center gap-3">
      <svg class="size-7 text-accent" viewBox="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="12" stroke="currentColor" stroke-width="2"/><path d="M8 16c2-8 12-8 14-2M22 14c-2 8-12 8-14 2" stroke="currentColor" stroke-width="2"/></svg>
      <span class="text-lg font-semibold tracking-tight">SpinSense</span>
    </div>
    <h1 class="text-2xl font-semibold tracking-tight">Local staff sign in</h1>
    {% if error %}<p role="alert" class="mt-4 rounded-md border border-negative bg-negative/10 px-3 py-2 text-sm text-ink">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="mt-6 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ destination }}">
      <div><label for="username" class="mb-1 block text-sm font-medium">Username</label><input id="username" name="username" required autocomplete="username" class="min-h-11 w-full rounded-md border border-control bg-raised px-3 text-ink focus-visible:outline-2 focus-visible:outline-accent"></div>
      <div><label for="password" class="mb-1 block text-sm font-medium">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" class="min-h-11 w-full rounded-md border border-control bg-raised px-3 text-ink focus-visible:outline-2 focus-visible:outline-accent"></div>
      <button type="submit" class="inline-flex min-h-11 w-full items-center justify-center rounded-md bg-ink px-4 font-semibold text-surface focus-visible:outline-2 focus-visible:outline-accent">Sign in</button>
    </form>
  </main>
</body>
</html>
