<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo checkout | SpinSense</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body class="min-h-dvh bg-canvas font-sans text-ink">
  <main class="mx-auto flex min-h-dvh w-full max-w-xl flex-col justify-center px-4 py-8">
    <a href="/machines" class="mb-6 inline-flex min-h-11 items-center self-start text-sm text-muted underline underline-offset-4 focus-visible:outline-2 focus-visible:outline-accent">Back to Machines</a>
    <section class="rounded-md border border-line bg-surface px-5 py-4 md:p-7">
      <h1 class="text-2xl font-semibold tracking-tight">Create demo checkout</h1>
      <p class="mt-3 text-sm text-muted">Choose the program currently selected on the machine. The QR expires after five minutes.</p>
      {% if error %}<p role="alert" class="mt-4 rounded-md border border-negative bg-raised p-3 text-sm text-negative">{{ error }}</p>{% endif %}
      <form method="post" class="mt-5 flex flex-col gap-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="source_id" value="{{ source_id }}">
        <div><label for="program" class="mb-2 block text-sm font-medium">Selected program</label>
          <select id="program" name="program_id" class="min-h-11 w-full rounded-md border border-control bg-raised px-3 text-base text-ink focus-visible:outline-2 focus-visible:outline-accent">{% for program in programs %}<option value="{{ program.id }}">{{ program.name }}</option>{% endfor %}</select></div>
        <button {% if not programs %}disabled{% endif %} class="min-h-11 rounded-md border border-ink bg-ink px-4 text-sm font-semibold text-surface focus-visible:outline-2 focus-visible:outline-accent disabled:border-control disabled:bg-raised disabled:text-muted">Generate demo QR</button>
      </form>
    </section>
  </main>
</body>
</html>
